# ==================================
# PERFIL PROD — sem defaults para valores sensiveis.
# Se a env var nao estiver setada no servidor, a aplicacao falha ao subir
# (proposital: melhor nao subir do que subir com credencial errada).
# Ativar com SPRING_PROFILES_ACTIVE=prod
# ==================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# sem dev-danger: nenhum changeset destrutivo roda aqui, mesmo que
# alguem esqueca de tirar a marcacao "dev-danger" do changeset.
spring.liquibase.contexts=production

jwt.secret=${JWT_SECRET}

# usuario admin semente — configurar com credenciais reais no servidor da clinica
app.seed-admin.username=${SEED_ADMIN_USERNAME}
app.seed-admin.password=${SEED_ADMIN_PASSWORD}
