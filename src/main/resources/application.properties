spring.application.name=service-management
# ==================================
# PORTA
# em producao (Render), a porta vem da variavel de ambiente PORT.
# localmente, sem essa variavel definida, continua 8080.
# ==================================
server.port=${PORT:8080}
# ==================================
# PERFIL ATIVO
# dev (padrao local) ou prod (ver application-dev.properties / application-prod.properties)
# ==================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ==================================
# DATASOURCE - driver e comum; url/usuario/senha ficam por perfil
# ==================================
spring.datasource.driver-class-name=org.postgresql.Driver
# ==================================
# LIQUIBASE (comum aos perfis; contexts fica em cada arquivo de perfil)
# ==================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.liquibase.drop-first=false
logging.level.liquibase=INFO
# ==================================
# JPA / HIBERNATE
# ==================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# ==================================
# FUSO HORÁRIO
# ==================================
spring.jackson.time-zone=America/Sao_Paulo
jwt.expiration-ms=3600000
