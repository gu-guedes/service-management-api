spring.application.name=service-management
# ==================================
# PORTA
# em producao (Render), a porta vem da variavel de ambiente PORT.
# localmente, sem essa variavel definida, continua 8080.
# ==================================
server.port=${PORT:8080}
# ==================================
# PERFIL ATIVO
# dev (padrao local) ou prod (ver application-dev.properties / application-prod.properties)
# ==================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ==================================
# DATASOURCE - driver e comum; url/usuario/senha ficam por perfil
# ==================================
spring.datasource.driver-class-name=org.postgresql.Driver
# ==================================
# LIQUIBASE (comum aos perfis; contexts fica em cada arquivo de perfil)
# ==================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.liquibase.drop-first=false
logging.level.liquibase=INFO
# ==================================
# JPA / HIBERNATE
# ==================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# ==================================
# FUSO HORÁRIO
# ==================================
spring.jackson.time-zone=America/Sao_Paulo
jwt.expiration-ms=3600000
# ==================================
# UPLOAD DE ARQUIVOS (resultado de exame em PDF)
# default do Spring (1MB/10MB) e baixo demais pra um PDF escaneado
# ==================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ==================================
# WHATSAPP BOT (chatbot de consulta via WhatsApp Cloud API)
# credenciais setadas via variavel de ambiente, nunca commitadas
# ==================================
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.authorized-phone=${WHATSAPP_AUTHORIZED_PHONE:}
# ==================================
# IA (transcricao de audio + interpretacao de frase livre, fallback do chatbot WhatsApp)
# so entra em jogo quando a sintaxe fixa nao reconhece o comando
# ==================================
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.transcription-model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
app.ai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
